<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Create consistent tracking links for email campaigns.">
<title>UTM Link Creator</title><link rel="stylesheet" href="styles.css">
</head>
<body><main>
<header><p class="eyebrow"><span></span> Marketing operations / 01</p><h1>UTM Link Creator</h1><p>Build a tracked link for your next email campaign.</p></header>
<form id="builder">
<label class="full">Destination URL<input name="destination" type="url" placeholder="https://example.com/catalog" required></label>
<label>Brand<input name="brand" placeholder="Studio North" required></label>
<label>Season<input name="season" placeholder="Fall Winter 2027" required></label>
<label>Catalog type<input name="catalog" placeholder="Lookbook" required></label>
<label>Link placement <span>optional</span><input name="placement" placeholder="Hero button"></label>
<label class="source">UTM source<input name="source" value="newsletter" required></label>
<label class="source">UTM medium<input value="email" readonly></label>
<div class="full controls"><button type="submit">Generate link <span aria-hidden="true">→</span></button><p id="error" role="alert"></p></div>
</form>
<section aria-labelledby="result-heading" class="result">
<div><h2 id="result-heading">Tracking link</h2><button type="button" id="copy" disabled>Copy link</button></div>
<label class="sr-only" for="output">Generated tracking link</label><textarea id="output" rows="2" readonly placeholder="Your link will appear here."></textarea>
<p id="status" role="status" aria-live="polite"></p>
</section>
<footer>Runs entirely in your browser. No links are stored or sent.</footer>
</main><script src="app.js"></script></body>
</html>
